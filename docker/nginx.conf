server {
    listen 80;
    root /usr/share/nginx/html;
    # Relative redirects (/pharmacies → /pharmacies/), so they work behind the 8080 and 8443 port maps.
    absolute_redirect off;

    # nginx's table lacks .mjs (MapLibre's worker); browsers refuse a module worker served as
    # application/octet-stream. A types block here replaces the inherited table, so re-include it.
    include mime.types;
    types {
        text/javascript mjs;
    }

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    location = / {
        return 302 /pharmacies/;
    }

    location /pharmacies/ {
        # GitHub Pages sends max-age=600 for everything.
        add_header Cache-Control "max-age=600";
    }
}
