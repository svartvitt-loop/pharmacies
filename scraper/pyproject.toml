[project]
name = "fsa-scraper"
version = "0.1.0"
description = "Fetches on-duty pharmacy schedules for Attica from fsa-efimeries.gr"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.12"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
