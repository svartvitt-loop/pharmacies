[project]
name = "fsa-scraper"
version = "0.1.0"
description = "Fetches on-duty pharmacy schedules for Attica from fsa-efimeries.gr"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.12"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "UP", "B"] # import order, modern syntax, likely bugs
