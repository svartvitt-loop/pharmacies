name: Scrape and deploy

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours (UTC); FSA publishes changes during the day
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Test scraper
        working-directory: scraper
        run: uv run pytest -q

      # If the source is down this step fails and the previously deployed site stays up.
      - name: Fetch duty schedules
        working-directory: scraper
        run: uv run python -m fsa_scraper --days 14 --out ../web/public/data/duties.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
