name: Scrape and deploy

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours (UTC); FSA publishes changes during the day
  push:
    branches: [main]
    # Changes that can't affect the built site don't need a build and deploy.
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE*"
      - ".claude/**"
      - ".vscode/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DAYS: 55 # FSA publishes about 8 weeks ahead; unpublished days are skipped
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Test scraper
        working-directory: scraper
        run: uv run pytest -q

      # Push builds reuse the data from the latest scheduled scrape, so code changes
      # deploy without hitting the source. Cache keys are immutable, hence one per run;
      # they include DAYS so changing it forces a fresh scrape.
      - name: Restore cached duty schedules
        id: duties-cache
        if: github.event_name == 'push'
        uses: actions/cache/restore@v6
        with:
          path: web/public/data/duties.json
          key: duties-${{ env.DAYS }}d-${{ github.run_id }}
          restore-keys: duties-${{ env.DAYS }}d-

      # Runs on schedule/dispatch, or on push when nothing was cached.
      # If the source is down this step fails and the previously deployed site stays up.
      - name: Fetch duty schedules
        if: steps.duties-cache.outputs.cache-matched-key == ''
        working-directory: scraper
        run: uv run python -m fsa_scraper --days "$DAYS" --out ../web/public/data/duties.json

      - name: Cache duty schedules
        if: steps.duties-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v6
        with:
          path: web/public/data/duties.json
          key: duties-${{ env.DAYS }}d-${{ github.run_id }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
