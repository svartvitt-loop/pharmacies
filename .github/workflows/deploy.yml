name: Scrape and deploy

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours (UTC); FSA publishes changes during the day
  push:
    branches: [main]
    # Changes that can't affect the built site don't need a build and deploy.
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE*"
      - ".claude/**"
      - ".vscode/**"
      - "compose.yaml"
      - "dev"
      - "docker/**"
      - ".dockerignore"
      - ".env.example"
  # Pull requests (Dependabot's) only run the tests.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Runs that deploy queue up behind each other; a newer push to a pull request cancels its older run.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6

      - name: Lint and test the scraper
        working-directory: scraper
        run: |
          uv run --locked ruff check
          uv run --locked ruff format --check
          uv run --locked pytest -q

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Lint, type-check and unit-test the site
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test

      # Code changes get the browser tests too; scheduled and manual runs only refresh the data.
      # They use Google Chrome, which the runner image has.
      - name: Playwright smoke tests
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        working-directory: web
        run: npm run test:e2e

      - name: Keep traces of failed Playwright tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: web/test-results
          retention-days: 7
          if-no-files-found: ignore

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30 # a healthy scrape takes about a minute; this cuts off endless retries
    env:
      DAYS: 55 # FSA publishes about 8 weeks ahead; unpublished days are skipped
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6

      # Push builds reuse the data from the latest scheduled scrape, so code changes
      # deploy without hitting the source. Cache keys are immutable, hence one per run;
      # they include DAYS so changing it forces a fresh scrape.
      - name: Restore cached duty schedules
        id: duties-cache
        if: github.event_name == 'push'
        uses: actions/cache/restore@v6
        with:
          path: web/public/data/duties.json
          key: duties-${{ env.DAYS }}d-${{ github.run_id }}
          restore-keys: duties-${{ env.DAYS }}d-

      # Runs on schedule/dispatch, or on push when nothing was cached.
      # If the source is down or its data looks broken, this step fails and the previously
      # deployed site stays up.
      - name: Fetch duty schedules
        if: steps.duties-cache.outputs.cache-matched-key == ''
        working-directory: scraper
        run: uv run --locked python -m fsa_scraper --days "$DAYS" --out ../web/public/data/duties.json

      - name: Cache duty schedules
        if: steps.duties-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v6
        with:
          path: web/public/data/duties.json
          key: duties-${{ env.DAYS }}d-${{ github.run_id }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can publish; the others run third-party code (actions, npm install scripts).
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
